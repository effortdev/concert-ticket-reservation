version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ticketing-backend
    env_file:
      - .env
    depends_on:
      - mysql
      - redis
    networks:
      - internal

  frontend:
    build: ./frontend
    container_name: ticketing-frontend
    networks:
      - internal
      - npm_shared

  mysql:
    image: mysql:8.0
    container_name: ticketing-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ticket_db
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    volumes:
      - redis_data:/data
    networks:
      - internal

volumes:
  mysql_data:
  redis_data:

networks:
  internal:
    driver: bridge
  npm_shared:
    external: true
    name: npm_default