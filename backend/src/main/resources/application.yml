server:
  port: 8080

spring:
  application:
    name: ticketing

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ticket_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ticketing
    password: ticketing1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
          # 카카오는 아직 미구현 - 발급받으면 아래 주석 해제
          # kakao:
          #   client-id: ${KAKAO_CLIENT_ID:}
          #   client-secret: ${KAKAO_CLIENT_SECRET:}
          #   client-authentication-method: client_secret_post
          #   authorization-grant-type: authorization_code
          #   redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          #   scope:
          #     - account_email
          #     - profile_nickname
          #   client-name: Kakao
        # provider:
        #   kakao:
        #     authorization-uri: https://kauth.kakao.com/oauth/authorize
        #     token-uri: https://kauth.kakao.com/oauth/token
        #     user-info-uri: https://kapi.kakao.com/v2/user/me
        #     user-name-attribute: id

jwt:
  secret: ${JWT_SECRET:change-this-secret-key-before-deploy-please-make-it-long-enough}
  access-token-expire-ms: 1800000    # 30분
  refresh-token-expire-ms: 604800000 # 7일

logging:
  level:
    com.effortdev.ticketing: debug